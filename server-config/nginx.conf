# ==============================================================================
# GLOBAL SALAH — PRODUCTION NGINX SERVER CONFIGURATION
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name globalsalah.com www.globalsalah.com;
    return 301 https://globalsalah.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.globalsalah.com;

    ssl_certificate /etc/letsencrypt/live/globalsalah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globalsalah.com/privkey.pem;

    return 301 https://globalsalah.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name globalsalah.com;

    root /var/www/globalsalah/public;
    index index.html index.php;

    ssl_certificate /etc/letsencrypt/live/globalsalah.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/globalsalah.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(), camera=(), payment=()" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;

    # 301 Redirects for Legacy Routes
    location = /about { return 301 /about-us/; }
    location = /contact { return 301 /contact-us/; }
    location = /terms-of-service { return 301 /terms-and-conditions/; }
    location = /terms { return 301 /terms-and-conditions/; }
    location = /qibla { return 301 /qibla-finder/; }
    location = /qibla-direction { return 301 /qibla-finder/; }
    location = /countries/saudi-arabia/makkah/ { return 301 /countries/saudi-arabia/mecca/; }
    location = /sitemap_index.xml { return 301 /sitemap.xml; }

    # Static Assets Long-Lived Caching
    location ~* \.(css|js|webp|png|jpg|jpeg|gif|svg|woff2|woff|ttf|mp3)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # HTML Caching (Must Revalidate)
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
